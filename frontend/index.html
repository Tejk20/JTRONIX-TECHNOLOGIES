<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JTRONIX · Employee Management</title>
  <meta name="description" content="JTRONIX Employee Management - choose your sign-in" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/styles.css" />
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='Arial'>J</text></svg>"
  />
</head>
<body class="landing-page">
  <main class="landing">
    <div class="landing__brand">
      <div class="brand-mark brand-mark--lg">J</div>
      <h1>JTRONIX</h1>
      <p>Employee Management System</p>
    </div>

    <div class="landing__cards">
      <a class="role-card" href="/admin/login/">
        <div class="role-card__icon icon--indigo">
          <svg viewBox="0 0 24 24" class="icon"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
        </div>
        <div class="role-card__body">
          <h2>Admin Sign In</h2>
          <p>Full access — add, delete and update employees.</p>
        </div>
        <span class="role-card__arrow">
          <svg viewBox="0 0 24 24" class="icon"><path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
        </span>
      </a>

      <a class="role-card" href="/employee/login/">
        <div class="role-card__icon icon--green">
          <svg viewBox="0 0 24 24" class="icon"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <div class="role-card__body">
          <h2>Employee Sign In</h2>
          <p>View-only access to the employee directory.</p>
        </div>
        <span class="role-card__arrow">
          <svg viewBox="0 0 24 24" class="icon"><path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
        </span>
      </a>
    </div>

    <p class="landing__footer">Built with FastAPI &amp; Vanilla JavaScript</p>
  </main>
</body>
</html>
