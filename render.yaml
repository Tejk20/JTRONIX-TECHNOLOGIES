services:
  - type: web
    name: jtronex-employee-management
    runtime: python
    plan: free
    region: singapore
    branch: master
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
